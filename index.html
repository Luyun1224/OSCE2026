<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115年單領域 OSCE 教案甄選評核系統</title>
<style>
  :root{
    --navy:#0B1A3A; --navy2:#14264f; --orange:#F39220; --orange-d:#d97c0c;
    --ink:#1b2536; --muted:#67748c; --line:#e3e8f0; --bg:#eef1f6;
    --ok:#1f9d6b; --ok-bg:#e4f6ee; --pend:#b9772a; --pend-bg:#fdf1e1; --none:#9aa5b8; --none-bg:#eef0f4;
    --card:#ffffff; --shadow:0 6px 22px rgba(11,26,58,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none}
  .hidden{display:none !important}

  /* ---------- LOGIN ---------- */
  #login{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(18px,4vw,42px);
    background:
      radial-gradient(circle at 18% 18%,rgba(83,177,255,.42) 0 18%,transparent 36%),
      radial-gradient(circle at 82% 12%,rgba(243,146,32,.36) 0 16%,transparent 34%),
      radial-gradient(circle at 50% 92%,rgba(99,102,241,.34) 0 20%,transparent 42%),
      linear-gradient(135deg,#071126 0%,#0b1a3a 44%,#173d68 100%);
    position:relative;overflow:hidden;
  }
  #login::before,
  #login::after{
    content:"";position:absolute;border-radius:999px;filter:blur(2px);opacity:.7;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.22);
  }
  #login::before{width:220px;height:220px;left:8%;bottom:10%;transform:rotate(18deg)}
  #login::after{width:150px;height:150px;right:10%;top:14%;transform:rotate(-22deg)}
  .login-card{
    width:100%;max-width:430px;background:rgba(255,255,255,.18);border-radius:28px;
    box-shadow:0 30px 90px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.38);
    overflow:hidden;position:relative;z-index:1;border:1px solid rgba(255,255,255,.34);
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  }
  .login-card::before{
    content:"";position:absolute;inset:0;background:
      linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.08) 45%,rgba(255,255,255,.18));
    pointer-events:none;
  }
  .login-head{background:linear-gradient(135deg,rgba(11,26,58,.7),rgba(20,38,79,.38));color:#fff;padding:32px 30px 26px;position:relative}
  .login-head::after{content:"";position:absolute;left:30px;right:30px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
  .login-head .org{font-size:13px;letter-spacing:1px;opacity:.82;margin-bottom:8px;position:relative}
  .login-head h1{font-size:clamp(20px,4.8vw,24px);line-height:1.45;font-weight:800;position:relative}
  .login-head .yr{color:#ffd39a;font-weight:800;text-shadow:0 0 18px rgba(243,146,32,.38)}
  .login-body{padding:28px 30px 32px;position:relative}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:800;color:rgba(255,255,255,.88);margin-bottom:7px}
  .field input{
    width:100%;padding:14px 15px;border:1px solid rgba(255,255,255,.38);border-radius:15px;
    font-size:15px;transition:.15s;background:rgba(255,255,255,.72);font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .field input:focus{outline:none;border-color:rgba(255,211,154,.9);background:rgba(255,255,255,.92);box-shadow:0 0 0 4px rgba(243,146,32,.22)}
  .btn-primary{
    width:100%;background:var(--orange);color:#fff;font-weight:800;font-size:16px;
    padding:14px;border-radius:15px;transition:.15s;margin-top:6px;
    box-shadow:0 16px 30px rgba(217,124,12,.28);
  }
  .btn-primary:hover{background:var(--orange-d);transform:translateY(-1px)}
  .login-err{color:#ffe1e1;font-size:13px;font-weight:700;margin-top:12px;text-align:center;min-height:18px;text-shadow:0 1px 8px rgba(0,0,0,.3)}
  .login-hint{margin-top:20px;border-top:1px dashed var(--line);padding-top:16px;font-size:12px;color:var(--muted);line-height:1.7}
  .login-hint b{color:var(--navy)}

  /* ---------- APP SHELL ---------- */
  .topbar{
    background:var(--navy);color:#fff;padding:0 22px;height:62px;display:flex;align-items:center;
    justify-content:space-between;position:sticky;top:0;z-index:30;box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  .topbar .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .topbar .logo{width:36px;height:36px;border-radius:9px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
  .topbar .ttl{font-size:15px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .ttl small{display:block;font-size:11px;font-weight:500;opacity:.72}
  .topbar .right{display:flex;align-items:center;gap:14px;flex:none}
  .who{font-size:13px;text-align:right;line-height:1.3}
  .who .role{display:inline-block;background:var(--orange);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;margin-top:3px}
  .who .role.admin{background:#3a6df0}
  .btn-out{background:rgba(255,255,255,.12);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px}
  .btn-out:hover{background:rgba(255,255,255,.22)}

  .wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}
  .page-h{margin:6px 2px 18px}
  .page-h h2{font-size:22px;font-weight:800;color:var(--navy)}
  .page-h p{font-size:13.5px;color:var(--muted);margin-top:5px}

  /* progress strip (reviewer) */
  .prog{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:20px}
  .prog .bar{flex:1;height:10px;background:#e8ecf3;border-radius:20px;overflow:hidden}
  .prog .bar > i{display:block;height:100%;background:var(--orange);transition:width .4s}
  .prog .num{font-weight:800;color:var(--navy);font-size:14px;white-space:nowrap}

  /* case cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .case{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;border:1px solid #eef1f6}
  .case .ch{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px}
  .case .no{width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
  .case .cmeta{flex:1;min-width:0}
  .case .cmeta h3{font-size:15.5px;font-weight:800;color:var(--ink);line-height:1.4}
  .case .cmeta .unit{font-size:12px;color:var(--muted);margin-top:3px}
  .pdf-ic{flex:none;width:38px;height:38px;border-radius:9px;background:#fdeedd;color:var(--orange-d);display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.15s;border:1px solid #f6dcbb}
  .pdf-ic:hover{background:var(--orange);color:#fff}
  .pdf-ic svg{width:20px;height:20px}
  .case .cf{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);background:#fafbfd}
  .pill{font-size:12px;font-weight:800;padding:5px 12px;border-radius:20px}
  .pill.ok{color:var(--ok);background:var(--ok-bg)}
  .pill.none{color:var(--none);background:var(--none-bg)}
  .case-total{font-size:12px;color:var(--muted);font-weight:700}
  .case-total b{color:var(--navy);font-size:15px}
  .btn-score{background:var(--navy);color:#fff;font-size:13.5px;font-weight:800;padding:9px 18px;border-radius:9px;transition:.15s}
  .btn-score:hover{background:var(--navy2)}
  .btn-score.done{background:#fff;color:var(--orange-d);border:1.5px solid var(--orange)}

  /* ---------- MODAL (scoring) ---------- */
  .ov{position:fixed;inset:0;background:rgba(7,15,35,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;backdrop-filter:blur(2px)}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:720px;box-shadow:0 30px 80px rgba(0,0,0,.4);overflow:hidden;margin:auto}
  .mh{background:var(--navy);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:2}
  .mh h3{font-size:16px;font-weight:800;line-height:1.4}
  .mh h3 span{display:block;font-size:12px;font-weight:500;opacity:.75;margin-top:3px}
  .mh .x{background:rgba(255,255,255,.14);color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;flex:none}
  .mh .x:hover{background:rgba(255,255,255,.26)}
  .mb{padding:8px 22px 4px;max-height:none}
  .grp{margin:16px 0}
  .grp-h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .grp-h .gname{font-size:14px;font-weight:800;color:var(--navy)}
  .grp-h .gw{font-size:11px;font-weight:800;color:var(--orange-d);background:#fdeedd;padding:2px 9px;border-radius:20px}
  .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
  .item .lab{flex:1;font-size:13.5px;line-height:1.55;color:var(--ink)}
  .item .lab .mx{font-size:11px;color:var(--muted);font-weight:700;margin-left:6px}
  .score-in{width:74px;flex:none}
  .score-in input{width:100%;text-align:center;padding:9px 6px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-weight:800;color:var(--navy);background:#fafbfd}
  .score-in input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(243,146,32,.15)}
  .score-in input.bad{border-color:#e0b4b4;background:#fdf2f2}
  .bonus-grp{background:#fdf8f0;border:1px solid #f6dcbb;border-radius:12px;padding:6px 16px 14px;margin:18px 0}
  .cmt{margin:6px 0 18px}
  .cmt label{display:block;font-size:13px;font-weight:800;color:var(--navy);margin-bottom:7px}
  .cmt textarea{width:100%;min-height:80px;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;resize:vertical;background:#fafbfd;line-height:1.6}
  .cmt textarea:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px rgba(243,146,32,.15)}
  .mf{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .mf .tot{font-size:13px;color:var(--muted);font-weight:700}
  .mf .tot b{font-size:22px;color:var(--orange-d);font-weight:800}
  .mf .tot b.over{color:#d23b3b}
  .mf .acts{display:flex;gap:10px}
  .btn-ghost{background:#eef1f6;color:var(--navy);font-weight:800;font-size:14px;padding:11px 18px;border-radius:10px}
  .btn-ghost:hover{background:#e2e7f0}
  .btn-save{background:var(--orange);color:#fff;font-weight:800;font-size:14px;padding:11px 24px;border-radius:10px}
  .btn-save:hover{background:var(--orange-d)}

  /* split modal: 左教案 PDF / 右評分 */
  .ov-wide{align-items:center;padding:16px}
  .modal-split{max-width:1240px;width:100%;height:92vh;display:flex;flex-direction:column}
  .modal-split .mh{flex:none}
  .open-new{color:#ffd9a8;font-size:12.5px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.12);padding:6px 11px;border-radius:8px;white-space:nowrap}
  .open-new:hover{background:rgba(255,255,255,.24)}
  .split{flex:1;display:flex;min-height:0}
  .pdf-pane{flex:1.3;min-width:0;background:#33373f;display:flex;align-items:center;justify-content:center;position:relative}
  .pdf-pane iframe{width:100%;height:100%;border:0;display:block}
  .pdf-empty{color:#c7cedd;text-align:center;font-size:13.5px;line-height:1.9;padding:30px}
  .pdf-empty svg{width:48px;height:48px;opacity:.45;margin-bottom:14px;display:block;margin-left:auto;margin-right:auto}
  .score-pane{flex:1;min-width:330px;max-width:470px;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);min-height:0}
  .score-scroll{flex:1;overflow-y:auto;padding:4px 20px 6px}
  .score-pane .mf{position:static;flex:none}
  @media(max-width:860px){
    .ov-wide{padding:0}
    .modal-split{height:100vh;max-width:100%;border-radius:0}
    .split{flex-direction:column}
    .pdf-pane{flex:none;height:44vh}
    .score-pane{max-width:none;min-width:0;border-left:none;border-top:1px solid var(--line)}
  }

  /* ---------- ADMIN ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;border-left:5px solid var(--orange)}
  .stat .k{font-size:12px;color:var(--muted);font-weight:700}
  .stat .v{font-size:28px;font-weight:800;color:var(--navy);margin-top:4px;line-height:1}
  .stat .v small{font-size:14px;color:var(--muted);font-weight:700}
  .panel{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h h3{font-size:16px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px}
  .panel-h h3 .dot{width:9px;height:20px;background:var(--orange);border-radius:3px}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
  th,td{padding:12px 12px;text-align:center;border-bottom:1px solid var(--line)}
  th{background:#f6f8fc;color:var(--navy);font-weight:800;font-size:12.5px;white-space:nowrap}
  td.tl,th.tl{text-align:left}
  tbody tr:hover{background:#fafbff}
  .rank-b{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:14px;background:#eef1f6;color:var(--navy)}
  .rank-b.r1{background:#f7d774;color:#7a5800}
  .rank-b.r2{background:#d9e0ea;color:#475066}
  .rank-b.r3{background:#f0c8a0;color:#7d4f23}
  .s-ok{color:var(--ok);font-weight:800}
  .s-no{color:var(--none);font-weight:700}
  .cellscore{font-weight:800;color:var(--navy)}
  .cellscore .sub{display:block;font-size:11px;font-weight:700;margin-top:2px}
  .avg-big{font-weight:800;color:var(--orange-d);font-size:16px}
  .title-cell{font-weight:800;color:var(--ink)}
  .title-cell small{display:block;font-weight:600;color:var(--muted);font-size:11px;margin-top:2px}
  .btn-mini{background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:8px}
  .btn-mini:hover{background:var(--navy2)}
  .btn-mini.ghost{background:#eef1f6;color:var(--navy)}
  .btn-mini.ghost:hover{background:#e2e7f0}
  .detail-row td{background:#fafbff;text-align:left;padding:0}
  .detail-inner{padding:14px 18px}
  .rev-block{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
  .rev-block:last-child{border:none;margin:0;padding:0}
  .rev-block .rn{font-weight:800;color:var(--navy);font-size:13.5px;margin-bottom:6px}
  .rev-block .rn .badge{font-weight:700;font-size:11px;margin-left:8px;padding:2px 9px;border-radius:20px}
  .rev-block .scoreline{font-size:12.5px;color:var(--muted);line-height:1.7}
  .rev-block .scoreline b{color:var(--navy)}
  .rev-block .cm{font-size:12.5px;color:var(--ink);margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;line-height:1.6}
  .note{font-size:12.5px;color:var(--muted);line-height:1.7;background:#fff7ec;border:1px solid #f6dcbb;border-radius:10px;padding:12px 15px;margin-bottom:20px}
  .note b{color:var(--orange-d)}

  @media(max-width:560px){
    #login{align-items:flex-start;padding-top:8vh}
    .login-card{max-width:100%;border-radius:24px}
    .login-head,.login-body{padding-left:22px;padding-right:22px}
    .topbar .ttl small{display:none}
    .grid{grid-template-columns:1fr}
    .mf{flex-direction:column;align-items:stretch}
    .mf .acts{justify-content:stretch}.mf .acts button{flex:1}
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-head">
      <div class="org" id="lg-org">奇美醫院 教學部 臨床技能中心</div>
      <h1><span class="yr">115 年</span> 單領域 OSCE<br>教案甄選評核系統</h1>
    </div>
    <div class="login-body">
      <div class="field">
        <label>帳號</label>
        <input id="lg-user" type="text" autocomplete="username" placeholder="請輸入帳號">
      </div>
      <div class="field">
        <label>密碼</label>
        <input id="lg-pass" type="password" autocomplete="current-password" placeholder="請輸入密碼">
      </div>
      <button class="btn-primary" id="lg-btn">登　入</button>
      <div class="login-err" id="lg-err"></div>

    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand">
      <div class="logo">OSCE</div>
      <div class="ttl">115 單領域 OSCE 教案甄選評核系統<small id="tb-org">奇美醫院 教學部 臨床技能中心</small></div>
    </div>
    <div class="right">
      <div class="who"><span id="tb-name"></span><br><span class="role" id="tb-role"></span></div>
      <button class="btn-out" id="btn-logout">登出</button>
    </div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<!-- modal mount -->
<div id="modal-mount"></div>

<script>
/* =====================================================================
   設定區（CONFIG）— 上線前在這裡修改即可
   ===================================================================== */
const CONFIG = {
  org: "奇美醫院 教學部 臨床技能中心",

  /* ---- 帳號密碼（預設，後續自行修改）---- */
  accounts: {
    admin:     { password:"admin123", role:"admin",    name:"管理者" },
    reviewer1: { password:"chi001",   role:"reviewer", name:"柯雅婷 督導" },
    reviewer2: { password:"chi002",   role:"reviewer", name:"劉韋呈 醫師" },
    reviewer3: { password:"chi003",   role:"reviewer", name:"蔡長志 主任" },
  },

  /* ---- 8 案教案 ----
     pdfUrl：直接貼 Google Drive 的「共用連結」即可，系統會自動轉成可內嵌的 /preview 形式。
     例： "https://drive.google.com/file/d/1AbCdEfG.../view?usp=sharing"
     （該檔案共用權限需設為「知道連結的人皆可檢視」）。尚未取得連結前留 "#" 即可。 */
  cases: [
    { id:1, title:"吞不下去好沮喪", unit:"復健部－語言治療", pdfUrl:"https://drive.google.com/file/d/1xfLGC1oPt1lV8xyTZLLkwHnV0yjNrKTz/view?usp=sharing" },
    { id:2, title:"Flo-trac 血流動力學監測系統儀器操作及數據判讀", unit:"護理部－3BICU", pdfUrl:"https://drive.google.com/file/d/11vHt_0x3_U9XA0x3O_mPFuKSJ4RW3T4g/view?usp=sharing" },

/* =====================================================================
   資料儲存層（localStorage；若不可用則退回記憶體，預覽環境也能跑）
   結構： scores[username][caseId] = { c1..c10, bonus, comment, submitted, updatedAt }
   ===================================================================== */
const STORE_KEY = "osce_selection_v1";
const Store = (()=>{
  let mem = {};
  let useLS = false;
  try{ const t="__t"; localStorage.setItem(t,"1"); localStorage.removeItem(t); useLS=true; }catch(e){ useLS=false; }
  function read(){
    if(useLS){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
    return mem;
  }
  function write(o){
    if(useLS){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(o)); }catch(e){} }
    else { mem = o; }
  }
  return {
    getAll: read,
    getReviewer(u){ const a=read(); return a[u]||{}; },
    getCase(u,cid){ const a=read(); return (a[u]&&a[u][cid])||null; },
    saveCase(u,cid,data){
      const a=read(); if(!a[u]) a[u]={}; a[u][cid]={...data, updatedAt:new Date().toISOString()};
      write(a); return a[u][cid];
    }
  };
})();

/* =====================================================================
   雲端 API（Apps Script）+ 統一資料層 DATA
   - CONFIG.apiUrl 有填 → 雲端模式：登入/讀取/儲存都經由 Google Sheet
   - CONFIG.apiUrl 留空 → 本機模式：用 CONFIG.accounts + localStorage（Store）
   ===================================================================== */
const CLOUD = !!CONFIG.apiUrl;

function api(payload){
  // 以 JSONP（<script> 載入）呼叫 Apps Script，完全不受 CORS 限制
  return new Promise((resolve, reject)=>{
    const cb = "__osce_cb_" + Date.now() + "_" + Math.floor(Math.random()*1e6);
    const s = document.createElement("script");
    let done = false;
    const timer = setTimeout(()=>{ if(!done){ cleanup(); const e=new Error("network"); e.kind="network"; reject(e); } }, 20000);
    function cleanup(){ done=true; clearTimeout(timer); try{ delete window[cb]; }catch(_){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (data)=>{ if(done) return; cleanup(); resolve(data); };
    s.onerror = ()=>{ if(!done){ cleanup(); const e=new Error("network"); e.kind="network"; reject(e); } };
    s.src = CONFIG.apiUrl + "?callback=" + cb + "&payload=" + encodeURIComponent(JSON.stringify(payload)) + "&t=" + Date.now();
    document.head.appendChild(s);
  });
}

/* 雲端模式的記憶體快取，結構與 Store 相同：cache[username][caseId]=rec */
const DATA = {
  cache: {},
  getAll(){ return CLOUD ? this.cache : Store.getAll(); },
  getReviewer(u){ const a=this.getAll(); return a[u]||{}; },
  getCase(u,cid){ const a=this.getAll(); return (a[u]&&a[u][cid])||null; },
  // 將 API 回傳的列陣列灌入快取
  loadRows(rows){
    const c={};
    (rows||[]).forEach(r=>{
      if(!c[r.username]) c[r.username]={};
      c[r.username][r.caseId] = { ...r.scores, bonus:r.bonus, comment:r.comment, submitted:true, updatedAt:r.updatedAt };
    });
    this.cache = c;
  }
};

/* 將 Google Drive 共用連結轉成可內嵌的 /preview 網址（其他直連網址原樣回傳） */
function toEmbedUrl(url){
  if(!url || url==="#") return null;
  let m = url.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
  if(m) return `https://drive.google.com/file/d/${m[1]}/preview`;
  m = url.match(/[?&]id=([^&]+)/);
  if(m && url.includes("google")) return `https://drive.google.com/file/d/${m[1]}/preview`;
  return url; // 已是 preview 或一般可內嵌之 PDF 直連
}

window.closeScore = function(){ $("#modal-mount").innerHTML=""; document.body.style.overflow=""; };
window.recalc = function(){
  let sum=0, over=false;
  document.querySelectorAll('#ov input[type=number]').forEach(inp=>{
    const k=inp.dataset.key, max=ITEM_DEF[k].max;
    let v=parseFloat(inp.value);
    if(isNaN(v)) v=0;
    if(v<0||v>max){ inp.classList.add('bad'); over=true; } else inp.classList.remove('bad');
    sum+=v;
  });
  const el=$("#m-tot"); if(el){ el.textContent=fmt(sum); el.classList.toggle('over',over); }
};
window.saveScore = async function(cid){
  const data={}; let bad=false;
  document.querySelectorAll('#ov input[type=number]').forEach(inp=>{
    const k=inp.dataset.key, max=ITEM_DEF[k].max;
    let v=parseFloat(inp.value); if(isNaN(v)) v=0;
    if(v<0||v>max) bad=true;
    data[k]=v;
  });
  if(bad){ alert("有評分超出該項目允許範圍，請修正後再儲存。"); return; }
  data.comment = $("#cmt").value.trim();
  data.submitted = true;

  const saveBtn = document.querySelector('#ov .btn-save');

  if(CLOUD){
    if(saveBtn){ saveBtn.disabled=true; saveBtn.textContent="儲存中…"; }
    const c = CONFIG.cases.find(x=>x.id===cid);
    const scores={}; BASE_KEYS.forEach(k=>scores[k]=data[k]);
    try{
      const res = await api({
        action:"save", username:SESSION.username, password:SESSION.password,
        caseId:cid, title:c.title, scores, bonus:data[CONFIG.bonus.key]||0, comment:data.comment
      });
      if(!res || !res.ok){ alert("儲存失敗："+((res&&res.error)||"未知錯誤")); if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="儲存評分";} return; }
      // 更新快取
      if(!DATA.cache[SESSION.username]) DATA.cache[SESSION.username]={};
      DATA.cache[SESSION.username][cid]={...data, updatedAt:new Date().toISOString()};
    }catch(err){
      alert("無法連線到伺服器，請稍後再試。"); if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="儲存評分";} return;
    }
    closeScore(); render(); return;
  }

  // 本機模式
  Store.saveCase(SESSION.username, cid, data);
  closeScore();
  render();
};

/* ---------------- 管理者（admin）視圖 ---------------- */
function renderAdmin(){
  const all = DATA.getAll();
  const reviewers = reviewerList();

  // 每案：各委員紀錄 + 平均
  const rows = CONFIG.cases.map(c=>{
    const per = reviewers.map(r=>{
      const rec = (all[r.username]&&all[r.username][c.id]) || null;
      return { ...r, rec, done: !!(rec&&rec.submitted), total: rec&&rec.submitted? totalScore(rec):null };
    });
    const subs = per.filter(p=>p.done);
    const avg = subs.length? subs.reduce((a,p)=>a+p.total,0)/subs.length : null;
    return { c, per, subs:subs.length, avg };
  });

  // 排名（依平均；全部委員都評完才正式計名次，未完成者排於後）
  const ranked = [...rows].sort((a,b)=>{
    const fa=a.subs===reviewers.length, fb=b.subs===reviewers.length;
    if(fa!==fb) return fa? -1:1;
    return (b.avg??-1)-(a.avg??-1);
  });
  const rankMap={}; ranked.forEach((r,i)=>{ rankMap[r.c.id]= (r.subs===reviewers.length)? i+1 : null; });

  // 統計
  const totalCells = CONFIG.cases.length*reviewers.length;
  const doneCells = rows.reduce((a,r)=>a+r.subs,0);
  const fullyDone = rows.filter(r=>r.subs===reviewers.length).length;
  const perReviewerDone = reviewers.map(r=>{
    const cnt = CONFIG.cases.filter(c=>all[r.username]&&all[r.username][c.id]&&all[r.username][c.id].submitted).length;
    return {...r, cnt};
  });

  // 委員進度表
  const revProgress = perReviewerDone.map(r=>{
    const pct=Math.round(r.cnt/CONFIG.cases.length*100);
    return `<tr>
      <td class="tl"><span class="title-cell">${esc(r.name)}</span></td>
      <td>${r.cnt} / ${CONFIG.cases.length}</td>
      <td><div class="bar" style="height:9px;background:#e8ecf3;border-radius:20px;overflow:hidden;min-width:120px"><i style="display:block;height:100%;width:${pct}%;background:var(--orange)"></i></div></td>
      <td>${r.cnt===CONFIG.cases.length?'<span class="s-ok">已完成</span>':'<span class="s-no">進行中</span>'}</td>
    </tr>`;
  }).join("");

  // 狀態 + 分數矩陣
  const head = `<th class="tl">編號 / 教案題目</th>` +
    reviewers.map(r=>`<th>${esc(r.name)}</th>`).join("") +
    `<th>平均總分</th><th>名次</th><th></th>`;

  const body = rows.map(r=>{
    const cells = r.per.map(p=>{
      if(p.done) return `<td><span class="cellscore">${fmt(p.total)}<span class="sub s-ok">已評</span></span></td>`;
      return `<td><span class="s-no">未評</span></td>`;
    }).join("");
    const rk = rankMap[r.c.id];
    const rkHtml = rk? `<span class="rank-b ${rk<=3?'r'+rk:''}">${rk}</span>` : `<span class="s-no">—</span>`;
    const avgHtml = r.avg!=null? `<span class="avg-big">${fmt(r.avg)}</span>` : `<span class="s-no">—</span>`;
    return `<tr>
      <td class="tl"><span class="title-cell">第 ${r.c.id} 案<small>${esc(r.c.title)}</small></span></td>
      ${cells}
      <td>${avgHtml}<div style="font-size:11px;color:var(--muted);margin-top:2px">${r.subs}/${reviewers.length} 已評</div></td>
      <td>${rkHtml}</td>
      <td><button class="btn-mini ghost" onclick="toggleDetail(${r.c.id})">明細</button></td>
    </tr>
    <tr class="detail-row hidden" id="dt-${r.c.id}"><td colspan="${reviewers.length+4}">${detailHtml(r)}</td></tr>`;
  }).join("");

  // 正式排名表（依平均）
  const rankRows = ranked.map((r,i)=>{
    const rk = rankMap[r.c.id];
    return `<tr>
      <td>${rk?`<span class="rank-b ${rk<=3?'r'+rk:''}">${rk}</span>`:'<span class="s-no">未完成</span>'}</td>
      <td class="tl"><span class="title-cell">第 ${r.c.id} 案<small>${esc(r.c.title)}</small></span></td>
      <td>${r.avg!=null?`<b style="color:var(--navy);font-size:15px">${fmt(r.avg)}</b> <small style="color:var(--muted)">/110</small>`:'<span class="s-no">—</span>'}</td>
      ${r.per.map(p=>`<td>${p.done?fmt(p.total):'<span class="s-no">—</span>'}</td>`).join("")}
      <td>${r.subs}/${reviewers.length}</td>
    </tr>`;
  }).join("");

  $("#view").innerHTML = `
    <div class="page-h">
      <h2>管理者後台</h2>
      <p>檢視三位委員的評核狀態、各案總分與排名。${CONFIG.apiUrl?'（雲端模式：資料存於 Google Sheet）':'（本機測試模式：資料暫存於瀏覽器）'}</p>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="k">教案總數</div><div class="v">${CONFIG.cases.length}<small> 案</small></div></div>
      <div class="stat"><div class="k">評審委員</div><div class="v">${reviewers.length}<small> 位</small></div></div>
      <div class="stat"><div class="k">評核完成度</div><div class="v">${doneCells}<small> / ${totalCells} 格</small></div></div>
      <div class="stat"><div class="k">三委員皆完成</div><div class="v">${fullyDone}<small> / ${CONFIG.cases.length} 案</small></div></div>
    </div>

    <div class="panel">
      <div class="panel-h"><h3><span class="dot"></span>委員評核進度</h3></div>
      <div class="tbl-scroll"><table style="min-width:520px">
        <thead><tr><th class="tl">委員</th><th>已評案數</th><th>進度</th><th>狀態</th></tr></thead>
        <tbody>${revProgress}</tbody>
      </table></div>
    </div>

    <div class="panel">
      <div class="panel-h">
        <h3><span class="dot"></span>各案評核狀態與分數</h3>
        <div style="display:flex;gap:8px">
          <button class="btn-mini ghost" onclick="exportCSV()">匯出 CSV</button>
          <button class="btn-mini" onclick="adminRefresh()">重新整理</button>
        </div>
      </div>
      <div class="tbl-scroll"><table>
        <thead><tr>${head}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>

    <div class="panel">
      <div class="panel-h"><h3><span class="dot"></span>教案排名（依三委員平均總分）</h3></div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>名次</th><th class="tl">教案</th><th>平均總分</th>${reviewers.map(r=>`<th>${esc(r.name)}</th>`).join("")}<th>完成</th></tr></thead>
        <tbody>${rankRows}</tbody>
      </table></div>
    </div>

    <div class="note">
      <b>排名規則：</b>以三位委員「總分平均」由高到低排序；尚未三位委員全部評完的教案，暫不列入正式名次（顯示「—」），待全部評核完成後即自動計算。匯出 CSV 可作為呈核或上傳 Google Sheet 之用。
    </div>
  `;
}

function detailHtml(r){
  return `<div class="detail-inner">` + r.per.map(p=>{
    if(!p.done) return `<div class="rev-block"><div class="rn">${esc(p.name)} <span class="badge s-no" style="background:var(--none-bg)">尚未評分</span></div></div>`;
    const rec=p.rec;
    const items = BASE_KEYS.map(k=>`${esc(ITEM_DEF[k].label).slice(0,10)}… <b>${rec[k]??0}</b>`).join("　");
    return `<div class="rev-block">
      <div class="rn">${esc(p.name)} <span class="badge s-ok" style="background:var(--ok-bg)">已評　總分 ${fmt(totalScore(rec))}/110</span></div>
      <div class="scoreline">基本分 <b>${fmt(baseSum(rec))}</b>／100　加分 <b>${fmt(rec[CONFIG.bonus.key]||0)}</b>／10</div>
      ${rec.comment?`<div class="cm">評審意見：${esc(rec.comment)}</div>`:''}
    </div>`;
  }).join("") + `</div>`;
}
window.toggleDetail = function(cid){ $("#dt-"+cid).classList.toggle("hidden"); };
window.adminRefresh = async function(){
  if(CLOUD){ await refreshCloud(); }
  render();
};

/* ---------------- 匯出 CSV ---------------- */
window.exportCSV = function(){
  const all = DATA.getAll();
  const reviewers = reviewerList();
  const head = ["編號","教案題目", ...reviewers.flatMap(r=>[r.name+" 基本分", r.name+" 加分", r.name+" 總分"]), "平均總分","已評委員數"];
  const lines=[head];
  CONFIG.cases.forEach(c=>{
    const row=[c.id, c.title];
    let subs=[], sum=0;
    reviewers.forEach(r=>{
      const rec=(all[r.username]&&all[r.username][c.id])||null;
      if(rec&&rec.submitted){ const t=totalScore(rec); row.push(baseSum(rec),fmt(rec[CONFIG.bonus.key]||0),fmt(t)); subs.push(t); sum+=t; }
      else row.push("","","");
    });
    row.push(subs.length?fmt(sum/subs.length):"", subs.length);
    lines.push(row);
  });
  const csv="\uFEFF"+lines.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="OSCE教案甄選分數_"+new Date().toISOString().slice(0,10)+".csv"; a.click();
};
</script>
</body>
